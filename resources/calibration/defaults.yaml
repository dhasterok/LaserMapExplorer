# Module-level defaults for the calibration pipeline. All are overridable per
# run (CLI argument or GUI control) -- these are just starting points.
drift_order: 1
accuracy_threshold_multiple: 2.0
split_odd_even: false
background:
  window: 10
  threshold_ratio: 100.0
  fallback_n_rows: 20
  search_margin: 5
  tail_margin: 20
# Deconvolution (src/deconvolution/) -- both correction flags default off,
# so an existing pipeline run's behavior is unchanged unless explicitly
# enabled. washout_tau_s is manual-entry only in this pass (per-analyte tau
# estimation from real edge/pulse data is Stage 2, not yet implemented) --
# an analyte with no entry here simply isn't washout-corrected.
# (Bidirectional-scan handling is InstrumentSettings.bidirectional_scan, not
# here -- it's acquisition geometry, not a correction toggle.)
deconvolution:
  apply_shift: false
  apply_washout: false
  washout_tau_s: {}
