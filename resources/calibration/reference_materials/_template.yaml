# Template for adding a new reference material. Copy this file to
# <STANDARD_NAME>.yaml (matching the filename label used by the raw data files,
# e.g. 'NIST612.yaml' for files named 'NIST612 - N.csv'), fill in 'standard' and
# the analyte value/uncertainty/uncertainty_type/source fields you have data for.
# Analytes with value: null are treated as legitimately unpopulated -- the
# calibration pipeline skips and warns on them rather than crashing, so you only
# need to fill in the analytes this standard actually certifies.
# Files starting with '_' (like this one) are skipped when loading the library.
#
# Certified isotope RATIOS (for mass-bias/radiogenic-ratio and cross-element
# dating-ratio calibration -- distinct from the elemental concentrations
# below) are entered under an `isotope_ratios:` block, e.g.:
#   isotope_ratios:
#     Pb206/Pb204:
#       numerator_element: Pb
#       numerator_mass: 206
#       denominator_element: Pb
#       denominator_mass: 204
#       value: 17.0
#       uncertainty: 0.01
#       uncertainty_type: "1SD"   # one of 1SD | 2SD | 95CI | SEM | 2SE, or omit if unknown
#       source: "TODO"
# Easiest to add via the "Edit reference standards" GUI dialog's Isotope
# ratios table (Add row / fill in / Save) rather than hand-editing YAML.
standard: STANDARD_NAME
description: "Description of this reference material"
source: "TODO: citation/source for the values below"
