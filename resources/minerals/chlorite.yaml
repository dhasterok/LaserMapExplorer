# Chlorite: (Mg,Fe,Al)6(Si,Al)4O10(OH)8 (tetrahedral T, octahedral M)
#
# OH assumed present at its ideal amount (8 per formula unit) but not fed
# into the oxygen-basis normalization at all (matching serpentine/talc) --
# ideal_oxygens=14 is the *anhydrous* (OH-excluded) framework total (18
# total O minus the 8 O contributed by the assumed-present OH groups,
# halved for O-equivalent... concretely: MinPlotX's own "anhydrous" O2
# target), not 18. Using the hydrous target (18) while still excluding OH
# from the measured sum would silently inflate every cation's apfu by
# ~30% (verified by hand) -- the target must match what's actually being
# summed, so OH is treated as invisible to the O-basis calculation
# entirely (neither counted in the input nor the target), not "included
# via a bigger target."
#
# Structurally identical to serpentine/talc (same tetra_fe3_ratio site
# method, same T/M pattern) -- see sites.py's _allocate_tetra_fe3_ratio.
mineral: chlorite
formula: (Mg,Fe,Al)6(Si,Al)4O10(OH)8
normalization:
  basis: oxygen
  ideal_oxygens: 14
  ideal_cations: 10
site_allocation:
  method: tetra_fe3_ratio
  tetra_fe3_ratio: 0.0   # conservative default: no Fe3+ routed to T unless configured otherwise
sites:
  T:
    target: 4.0
    elements: [Si, Fe3, Al]
    priority: [Si, Fe3, Al]
  M:
    target: 6.0
    elements: [Al, Fe3, Ti, Cr, Ni, Fe2, Mn, Mg]
    priority: [Al, Fe3, Ti, Cr, Ni, Fe2, Mn, Mg]
redox:
  elements: [Fe]
  methods: [fixed_ratio]
  default_method: fixed_ratio
  fixed_ratio: 0.0   # MinPlotX default: assume all Fe is Fe2+ unless a ratio is supplied
end_members:
  method: xmg_ratio
  members: [mg_number]
