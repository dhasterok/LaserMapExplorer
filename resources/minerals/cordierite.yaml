# Cordierite: Al3(Mg,Fe)2[Si5AlO18] (two tetrahedral rings T1/T2, octahedral B, channel A)
#
# OH/volatile note (applies across this whole mineral batch -- see the Stage
# 3 plan): cordierite has no OH/volatile site at all in MinPlotX, so nothing
# is omitted here. Fe redox is a fixed user ratio (MinPlotX default: assume
# all Fe is ferric), not charge-balance estimated -- reported on the
# oxygen-fixed basis directly (basis: oxygen), matching MinPlotX's own
# convention for every non-charge-balance mineral in this batch.
mineral: cordierite
formula: Al3(Mg,Fe)2[Si5AlO18]
normalization:
  basis: oxygen
  ideal_oxygens: 18
  ideal_cations: 11
sites:
  T1:
    target: 6.0
    elements: [Si, Fe3, Al]
    priority: [Si, Fe3, Al]
  T2:
    target: 2.0
    elements: [Al, Ti]
    priority: [Al, Ti]
  B:
    target: 2.0
    elements: [Fe2, Mn, Mg]
    priority: [Fe2, Mn, Mg]
  A:
    target: 1.0
    elements: [Ca, Na, K]
    priority: [Ca, Na, K]
redox:
  elements: [Fe]
  methods: [fixed_ratio]
  default_method: fixed_ratio
  fixed_ratio: 1.0   # MinPlotX default: assume all Fe is Fe3+ unless a ratio is supplied
end_members:
  method: xmg_ratio
  members: [mg_number]
