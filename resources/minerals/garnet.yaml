# Garnet: X3Y2Z3O12 (dodecahedral X, octahedral Y, tetrahedral Z)
mineral: garnet
formula: X3Y2Z3O12
normalization:
  basis: cation
  ideal_oxygens: 12
  ideal_cations: 8
sites:
  Z:
    target: 3.0
    elements: [Si, Al, Fe3]
    priority: [Si, Al, Fe3]     # fill order when site is under-occupied
  Y:
    target: 2.0
    elements: [Al, Cr, Fe3, Ti]
    priority: [Al, Cr, Fe3, Ti]
    # MinPlotX's reference garnet model also lets Mg/Fe2/Mn spill into Y if
    # Al/Cr/Fe3/Ti don't fill it (rare -- Mg-rich or vacant garnets). Not
    # modeled here: would need elements/priority semantics that let an
    # element belong to a site only as a last-resort fallback. Small effect
    # where it applies (~0.2% of X-site total in the one reference analysis
    # checked so far, tests/test_stoichiometry_garnet_workbook_reference.py).
  X:
    target: 3.0
    elements: [Ca, Mg, Fe2, Mn, Y, REE]
    priority: [Ca, Mg, Fe2, Mn, Y, REE]
redox:
  elements: [Fe]
  methods: [all_2plus, all_3plus, droop_1987]
  default_method: droop_1987
trace_elements:
  structural: [Y, Sc, Zn, Co, Ni]
  excluded: [Zr, Hf, Nb]   # likely inclusion contamination, not structural garnet chemistry
end_members:
  method: locock_2008
  members: [pyrope, almandine, spessartine, grossular, andradite, uvarovite]
qc_checks:
  - hydrogarnet_substitution
