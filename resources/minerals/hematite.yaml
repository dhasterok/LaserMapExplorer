# Hematite: Fe2O3 (corundum-structure sesquioxide, single octahedral site)
# -- no reference workbook exists for this mineral (see the per-mineral
# test file's docstring).
#
# Unlike every other mineral in this library, default_method is all_3plus
# rather than droop_1987: hematite has no coupled framework substitution
# (no Ti/Al-for-Si tetrahedral site, no separate divalent site) for a
# charge-balance residual to mean anything against -- droop_1987 is still
# offered for the rare case of real ferrous impurity (e.g. an
# ilmenite-exsolution-contaminated spot), but "assume all Fe is Fe3+" is
# the physically sensible default for a corundum-structure sesquioxide.
#
# No end_members block -- a single near-pure phase, same as
# allanite/serpentine/talc (no end-member concept ported for those either).
mineral: hematite
abbreviation: Hem
formula: Fe2O3
normalization:
  basis: cation
  ideal_oxygens: 3
  ideal_cations: 2
sites:
  M:
    target: 2.0
    elements: [Fe3, Fe2, Al, Cr, Ti, Mn]
    priority: [Fe3, Al, Cr, Ti, Mn, Fe2]
redox:
  elements: [Fe]
  methods: [all_2plus, all_3plus, droop_1987]
  default_method: all_3plus
