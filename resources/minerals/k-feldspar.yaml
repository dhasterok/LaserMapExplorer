# K-feldspar (orthoclase/microcline/sanidine): (K,Na,Ca)(Al,Si)4O8 --
# structurally identical alkali/plagioclase feldspar model (tetrahedral T,
# A-site), same generic engine as plagioclase.yaml, just K-led framing for
# UI discoverability. Ba can be a significant trace substituent in some
# alkali feldspars (celsian component) -- it's tracked in the A site's apfu
# for QC/reporting, but feldspar_ratio (below) only computes An/Ab/Or from
# Ca/Na/K, matching the workbook's own "*based on Ca, Na, K ratios only"
# convention -- no separate celsian fraction is reported.
mineral: k-feldspar
formula: XT4O8
normalization:
  basis: cation
  ideal_oxygens: 8
  ideal_cations: 5
sites:
  T:
    target: 4.0
    elements: [Si, Al, Ti, Fe3]
    priority: [Si, Al, Ti, Fe3]     # fill order when site is under-occupied
  A:
    target: 1.0
    elements: [K, Na, Ca, Ba, Sr, Mg, Fe2, Mn]
    priority: [K, Na, Ca, Ba, Sr, Mg, Fe2, Mn]
redox:
  elements: [Fe]
  methods: [all_2plus, all_3plus, droop_1987]
  default_method: droop_1987
end_members:
  method: feldspar_ratio
  members: [anorthite, albite, orthoclase]
