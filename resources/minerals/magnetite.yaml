# Magnetite (incl. titanomagnetite): Fe3O4, AB2O4 inverse spinel structure
# (tetrahedral A, octahedral D). Same spinel_xmg engine and full end-member
# list as resources/minerals/spinel.yaml (magnetite is chemically a member
# of the spinel group, and spinel_xmg already reports a "magnetite"
# fraction) -- provided as its own top-level entry because Fe-Ti oxide
# trace-element chemistry (magnetite/titanomagnetite fingerprinting in ore
# deposits and provenance studies) is this software's dominant LA-ICP-MS
# use case for this phase, and a user looking for "magnetite" shouldn't
# need to know to pick "spinel" instead. The member list is kept identical
# (not trimmed to Fe-Ti-only members) so the reported percentages still sum
# to 100 -- see spinel_xmg's docstring in endmembers.py.
mineral: magnetite
formula: AD2O4
normalization:
  basis: cation
  ideal_oxygens: 4
  ideal_cations: 3
site_allocation:
  method: spinel_xmg
sites:
  D:
    target: 2.0
    elements: [Al, V, Cr, Fe3, Fe2, Mg]
    priority: [Al, V, Cr, Fe3, Fe2, Mg]
  A:
    target: 1.0
    elements: [Si, Ti, Ni, Zn, Co, Mn, Fe2, Mg]
    priority: [Si, Ti, Ni, Zn, Co, Mn, Fe2, Mg]
redox:
  elements: [Fe]
  methods: [all_2plus, all_3plus, droop_1987]
  default_method: droop_1987
end_members:
  method: spinel_xmg
  members: [
    chromite, magnesiochromite, cr_mn, cr_ni, cr_zn, cr_co,
    magnetite, magnesioferrite, jacobsite, trevorite, franklinite, fe3_co,
    hercynite, spinel, galaxite, al_ni, gahnite, al_co,
    coulsonite, magnesiocoulsonite, v_mn, v_ni, v_zn, v_co,
    ahrensite, ringwoodite, ulvospinel, qandilite,
  ]
