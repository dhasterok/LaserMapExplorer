# Mica (generic di/trioctahedral): K(Mg,Fe,Al)2-3(Si,Al)4O10(OH)2
# (tetrahedral T, octahedral M, interlayer I)
#
# Reuses the tetra_fe3_ratio site method (serpentine/talc/chlorite's
# pattern) -- MinPlotX's mica model has the same Si/Fe3+(ratio)/Al(capped)
# T-site, uncapped M-site, plus a third, fully-independent interlayer site
# (Ca/Na/K/Ba) that sites.py's _allocate_tetra_fe3_ratio now supports as an
# optional trailing site.
#
# OH assumed present at its ideal amount (2 per formula unit) but excluded
# from the oxygen-basis normalization -- MinPlotX's iterative OH-convergence
# solving isn't ported at all, per the same "assume OH is ideally present"
# decision used throughout this batch.
#
# ideal_oxygens=11, NOT the naive "framework O count minus OH" (which would
# be 10) -- the correct target is whatever this engine's own O-per-cation
# accounting (STANDARD_OXIDES ratios: SiO2->2, Al2O3->1.5, MgO/FeO->1,
# K2O->0.5) gives for the ideal formula, since that's the same accounting
# normalize_to_oxygen actually uses. For ideal muscovite (Si3, Al3 total,
# K1): 3*2 + 3*1.5 + 1*0.5 = 11. For ideal phlogopite (Si3, Al1(tet), Mg3,
# K1): 3*2 + 1*1.5 + 3*1 + 1*0.5 = 11 too (the same target regardless of
# di/trioctahedral occupancy, verified by hand for both end-members --
# each reproduces its own apfu and end-member fraction exactly at 100%).
# A target of 10 was tried first and found to systematically under-fill M
# (confirmed on both ideal end-members) -- this comment intentionally
# records the correct derivation method, since apatite/staurolite in this
# same batch had the analogous mistake (naive anhydrous-O-count instead of
# this ratio-sum) and needed the identical fix.
mineral: mica
formula: K(Mg,Fe,Al)2-3(Si,Al)4O10(OH)2
normalization:
  basis: oxygen
  ideal_oxygens: 11
  ideal_cations: 8
site_allocation:
  method: tetra_fe3_ratio
  tetra_fe3_ratio: 0.0   # conservative default: no Fe3+ routed to T unless configured otherwise
sites:
  T:
    target: 4.0
    elements: [Si, Fe3, Al]
    priority: [Si, Fe3, Al]
  M:
    target: 3.0
    elements: [Al, Fe3, Ti, Cr, Fe2, Mn, Mg]
    priority: [Al, Fe3, Ti, Cr, Fe2, Mn, Mg]
  I:
    target: 1.0
    elements: [Ca, Na, K, Ba]
    priority: [Ca, Na, K, Ba]
redox:
  elements: [Fe]
  methods: [fixed_ratio]
  default_method: fixed_ratio
  fixed_ratio: 0.0   # MinPlotX default: assume all Fe is Fe2+ unless a ratio is supplied
end_members:
  method: mica_cascade
  members: [celadonite, al_celadonite, margarite, paragonite, muscovite, pyrophyllite, phlogopite, annite, eastonite, siderophyllite]
