# Olivine: (Mg,Fe,Mn,Ca)2SiO4 (tetrahedral T, octahedral M)
mineral: olivine
abbreviation: Ol
formula: X2SiO4
normalization:
  basis: cation
  ideal_oxygens: 4
  ideal_cations: 3
sites:
  T:
    target: 1.0
    elements: [Si, Al, Fe3]
    priority: [Si, Al, Fe3]     # fill order when site is under-occupied
  M:
    target: 2.0
    elements: [Al, Ti, Fe3, Cr, Ni, Fe2, Mn, Mg, Ca]
    priority: [Al, Ti, Fe3, Cr, Ni, Fe2, Mn, Mg, Ca]
redox:
  elements: [Fe]
  methods: [all_2plus, all_3plus, droop_1987]
  default_method: droop_1987
end_members:
  method: olivine_ratio
  members: [forsterite, fayalite, tephroite, ca_olivine]
