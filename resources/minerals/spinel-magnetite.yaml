# Spinel group (incl. magnetite/titanomagnetite): AB2O4 (tetrahedral A,
# octahedral D). A single config covers the whole group -- magnetite is
# chemically just the Fe3+-dominant member of this same spinel_xmg solid
# solution (spinel_xmg already reports a "magnetite" end-member fraction),
# so there's no separate calculation to duplicate. Named "spinel-magnetite"
# (rather than just "spinel") so it's still discoverable under both names --
# Fe-Ti oxide trace-element chemistry (magnetite/titanomagnetite
# fingerprinting in ore deposits and provenance studies) is one of this
# software's dominant LA-ICP-MS use cases for this phase, and a user
# looking for "magnetite" shouldn't need to know to search for "spinel".
mineral: spinel-magnetite
abbreviation: Spl
formula: AD2O4
normalization:
  basis: cation
  ideal_oxygens: 4
  ideal_cations: 3
site_allocation:
  # Fe2+/Mg are equipartitioned between D and A by the bulk XFe/XMg ratio,
  # scaled by how much Si+Ti occupies A -- see sites.py's
  # _allocate_spinel_xmg docstring. The elements/priority lists below are
  # still used for QC/validation and reporting; the actual apportionment
  # logic is dedicated.
  method: spinel_xmg
sites:
  D:
    target: 2.0
    elements: [Al, V, Cr, Fe3, Fe2, Mg]
    priority: [Al, V, Cr, Fe3, Fe2, Mg]
  A:
    target: 1.0
    elements: [Si, Ti, Ni, Zn, Co, Mn, Fe2, Mg]
    priority: [Si, Ti, Ni, Zn, Co, Mn, Fe2, Mg]
redox:
  elements: [Fe]
  methods: [all_2plus, all_3plus, droop_1987]
  default_method: droop_1987
qc_checks:
  - spinel_other_fraction
end_members:
  method: spinel_xmg
  # Tiered scheme -- see endmembers.py's _spinel_xmg docstring for the full
  # design rationale (too many named end-members in the old 28-member port
  # to be practically useful):
  #   Tier 1 (always on, 8): the classic spinel prism (Al/Cr/Fe3+ x Mg/Fe2+)
  #     plus the titanomagnetite join, folding Ti into a pseudo-trivalent
  #     [Fe2+Ti] component.
  #   Tier 2 (auto-enabled once Mn or Zn is a non-negligible share of the
  #     divalent axis): galaxite/manganochromite/jacobsite (Mn), gahnite/
  #     franklinite (Zn).
  #   Tier 3 (auto-enabled once V is a non-negligible share of the
  #     trivalent axis, i.e. it was actually analyzed): coulsonite,
  #     magnesiocoulsonite.
  #   other: the residual -- always present, captures every dropped cell
  #     (all Ni/Co end-members, zincochromite, V-Mn/V-Zn cells, and Si,
  #     which gets no axis role at all here -- ringwoodite/ahrensite belong
  #     in a separate silicate-spinel phase, not this oxide calculator).
  members: [
    spinel, hercynite, magnesiochromite, chromite, magnesioferrite, magnetite, qandilite, ulvospinel,
    galaxite, manganochromite, jacobsite, gahnite, franklinite,
    coulsonite, magnesiocoulsonite,
    other,
  ]
  # Standard petrologic ratios -- tier-independent (always computed from
  # true occupancy), and the primary/leading diagnostic output; the tiered
  # end-members above are a secondary convenience for the handful of names
  # that appear in the literature. See config.py's EndMemberConfig.ratios
  # docstring for why these are kept structurally separate from `members`.
  ratios: [cr_number, mg_number, fe3_over_r3, x_usp]
