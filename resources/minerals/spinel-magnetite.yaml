# Spinel group (incl. magnetite/titanomagnetite): AB2O4 (tetrahedral A,
# octahedral D). A single config covers the whole group -- magnetite is
# chemically just the Fe3+-dominant member of this same spinel_xmg solid
# solution (spinel_xmg already reports a "magnetite" end-member fraction),
# so there's no separate calculation to duplicate. Named "spinel-magnetite"
# (rather than just "spinel") so it's still discoverable under both names --
# Fe-Ti oxide trace-element chemistry (magnetite/titanomagnetite
# fingerprinting in ore deposits and provenance studies) is one of this
# software's dominant LA-ICP-MS use cases for this phase, and a user
# looking for "magnetite" shouldn't need to know to search for "spinel".
mineral: spinel-magnetite
abbreviation: Spl
formula: AD2O4
normalization:
  basis: cation
  ideal_oxygens: 4
  ideal_cations: 3
site_allocation:
  # Fe2+/Mg are equipartitioned between D and A by the bulk XFe/XMg ratio,
  # scaled by how much Si+Ti occupies A -- see sites.py's
  # _allocate_spinel_xmg docstring. The elements/priority lists below are
  # still used for QC/validation and reporting; the actual apportionment
  # logic is dedicated.
  method: spinel_xmg
sites:
  D:
    target: 2.0
    elements: [Al, V, Cr, Fe3, Fe2, Mg]
    priority: [Al, V, Cr, Fe3, Fe2, Mg]
  A:
    target: 1.0
    elements: [Si, Ti, Ni, Zn, Co, Mn, Fe2, Mg]
    priority: [Si, Ti, Ni, Zn, Co, Mn, Fe2, Mg]
redox:
  elements: [Fe]
  methods: [all_2plus, all_3plus, droop_1987]
  default_method: droop_1987
end_members:
  method: spinel_xmg
  members: [
    chromite, magnesiochromite, cr_mn, cr_ni, cr_zn, cr_co,
    magnetite, magnesioferrite, jacobsite, trevorite, franklinite, fe3_co,
    hercynite, spinel, galaxite, al_ni, gahnite, al_co,
    coulsonite, magnesiocoulsonite, v_mn, v_ni, v_zn, v_co,
    ahrensite, ringwoodite, ulvospinel, qandilite,
  ]
