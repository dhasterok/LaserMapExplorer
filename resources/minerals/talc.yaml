# Talc: Mg3Si4O10(OH)2 (tetrahedral T, octahedral M)
#
# Structurally near-identical to serpentine (same T/M scheme, same
# tetra_fe3_ratio Fe3+ split), differing mainly in Opfu/site targets and
# M's extra Na/K. No end-member scheme in MinPlotX for this mineral (no
# end_members: block).
mineral: talc
formula: Mg3Si4O10(OH)2
normalization:
  basis: oxygen
  ideal_oxygens: 11
  ideal_cations: 7
site_allocation:
  method: tetra_fe3_ratio
  tetra_fe3_ratio: 0.0   # conservative default: no Fe3+ routed to T unless configured otherwise
sites:
  T:
    target: 4.0
    elements: [Si, Fe3, Al]
    priority: [Si, Fe3, Al]
  M:
    target: 3.0
    elements: [Al, Fe3, Ti, Cr, Ni, Fe2, Mn, Mg, Ca, Na, K]
    priority: [Al, Fe3, Ti, Cr, Ni, Fe2, Mn, Mg, Ca, Na, K]
redox:
  elements: [Fe]
  methods: [fixed_ratio]
  default_method: fixed_ratio
  fixed_ratio: 0.0   # conservative default: talc Fe is typically ferrous-dominant
