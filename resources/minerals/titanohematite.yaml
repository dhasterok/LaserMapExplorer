# Titanohematite: FeTiO3-Fe2O3 ilmenite-hematite solid-solution series
# (single octahedral site, no T/M split in MinPlotX's own model). Covers
# hematite as an end-member (see end_members below) rather than treating it
# as a separate near-pure-phase config -- there is no standalone
# hematite.yaml. Abbreviation is kept as 'Ilm' (Whitney & Evans 2010 has no
# entry for the series name itself) so existing output column names are
# unaffected by this rename.
mineral: titanohematite
abbreviation: Ilm
formula: FeTiO3-Fe2O3 (ilmenite-hematite series)
normalization:
  basis: cation
  ideal_oxygens: 3
  ideal_cations: 2
sites:
  M:
    target: 2.0
    elements: [Ti, Si, Al, Cr, V, Fe3, Fe2, Mn, Mg, Ca]
    priority: [Ti, Si, Al, Cr, V, Fe3, Fe2, Mn, Mg, Ca]
redox:
  # Reuses droop_1987 unchanged -- ilmenite_Fe3unknown.m has the identical
  # oxygen-deficiency charge-balance loop already ported for garnet.
  elements: [Fe]
  methods: [all_2plus, all_3plus, droop_1987]
  default_method: droop_1987
end_members:
  method: ilmenite_ratio
  members: [hematite, ilmenite, pyrophanite, geikielite]
