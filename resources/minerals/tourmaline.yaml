# Tourmaline (schorl-dravite-elbaite group): XY3Z6(T6O18)(BO3)3V3W, X = Na,
# Ca, K or vacancy; Y = Mg, Fe2+, Al, Li, Mn, Fe3+, Ti, Zn; Z = Al, Fe3+,
# Cr, V; T = Si, Al; B (borate) = B; V/W (OH,F,O anion sites) not tracked.
# No reference workbook exists for this mineral (Stage 3-style batch entry,
# same "characterization test, not workbook cross-check" precedent as
# ilmenite/hematite/monazite/titanite).
#
# Four shared-pool sites (T, Z, Y, X) reuse the *generic* priority-fill
# engine, same shape as amphibole's T/C/B/A chain (no dedicated
# site-allocation function needed): T (target 6: Si then Al(iv) filling the
# remainder -- Al is also shared with Z and Y, so overflow spills onward),
# Z (target 6: Al first -- always the dominant Z-site cation -- then
# Fe3+/Cr/V; Al capped here since Y also lists it, so any Al beyond Z's
# target continues into Y), Y (target 3: the group-defining site --
# Mg-dominant is dravite, Fe2+-dominant is schorl, Li+Al-dominant is
# elbaite), X (target <=1, last/uncapped: Na then Ca then K -- commonly
# significantly vacant, e.g. foitite/rossmanite; the oxygen-basis
# normalization below is robust to that vacancy the same way amphibole's
# A-site vacancy is, since a vacancy contributes no cation/no oxide term).
# B (target 3, its own unshared site) takes whatever B is measured
# (tourmaline's B site is essentially always full and B-only in nature, but
# unlike F/Cl/OH, B *is* measurable by this tool's real inputs -- LA-ICP-MS
# -- so it's tracked directly rather than assumed, per apatite.yaml's
# anion-tracking rule).
#
# ideal_oxygens=29 -- not the naive "31-anion basis minus 4 (OH,F)" count
# (27, tried first); the correct target is whatever this engine's own
# O-per-cation accounting (STANDARD_OXIDES ratios) gives for the ideal
# formula, same derivation rule as apatite.yaml/mica.yaml/monazite.yaml.
# Numerically verified across two independent charge-conserving Y-site
# substitutions -- dravite (Na=1, Mg=3, Al=6, Si=6, B=3) and elbaite
# (Na=1, Li=1.5, Al=7.5, Si=6, B=3) -- both give exactly 29.0, since every
# standard tourmaline substitution vector modeled here (Al-Mg/Fe2+
# exchange, Li+Al-for-Mg, Na+Mg-for-[]+Al, Na+Al-for-Ca+Mg) conserves total
# cation charge, and this engine's O-per-cation ratio *is* charge/2 by
# construction -- so ideal_oxygens=29 holds across the whole modeled solid
# solution, not just the dravite end-member. ideal_cations=19
# (T6+Z6+Y3+X1+B3) is informational only (basis is oxygen, so this figure
# isn't used for normalization -- see normalize.normalize_to_oxygen).
#
# Fe redox: fixed_ratio only (default 0.0, all ferrous) -- same fallback
# convention already used for amphibole/mica/cordierite/staurolite/
# serpentine; no charge-balance Fe3+ estimator is validated for tourmaline's
# 4-site Y/Z framework.
#
# end_members: reuses xmg_ratio unchanged (same method as chloritoid/
# cordierite/chlorite) for a dravite<->schorl Mg-number diagnostic off the Y
# site's Mg/(Mg+Fe2+). No further classification (uvite, elbaite, foitite,
# etc.) is attempted -- Henry et al. (2011)'s full nomenclature scheme needs
# a bespoke formula this port has no validated reference for (same
# "don't invent an unvalidated scheme" rule as monazite.yaml dropping
# cheralite or epidote.yaml dropping piemontite).
mineral: tourmaline
abbreviation: Tur
formula: XY3Z6(T6O18)(BO3)3V3W
normalization:
  basis: oxygen
  ideal_oxygens: 29
  ideal_cations: 19
sites:
  T:
    target: 6.0
    elements: [Si, Al]
    priority: [Si, Al]
  Z:
    target: 6.0
    elements: [Al, Fe3, Cr, V]
    priority: [Al, Fe3, Cr, V]
  Y:
    target: 3.0
    elements: [Mg, Fe2, Al, Li, Mn, Fe3, Ti, Zn]
    priority: [Mg, Fe2, Al, Li, Mn, Fe3, Ti, Zn]
  X:
    target: 1.0
    elements: [Na, Ca, K]
    priority: [Na, Ca, K]
  B:
    target: 3.0
    elements: [B]
    priority: [B]
redox:
  elements: [Fe]
  methods: [fixed_ratio]
  default_method: fixed_ratio
  fixed_ratio: 0.0
end_members:
  method: xmg_ratio
  members: [mg_number]
